# Paramètres de l'étape « analyses ».

[periode]
# Années retenues : de premiere_annee à derniere_annee incluses.
premiere_annee = 1996
derniere_annee = 2025

[publications]
# Notices par plateforme et par année (bornes de la période).
# Œuvres par concept et par année, à partir de premiere_annee (sans borne haute).
# Co-occurrences concept A × concept B, en œuvres distinctes.
seuil_lien_co_occurrence = 3
annees_citees = [2001, 2011, 2021]

[mots_cles]
# Part des mots-clés du bloc B : libellés fusionnés et ordre du bloc B.
fusion_libelles = { "cartographie/mapping" = "cartographie", "cartographie/mapping/webSIG" = "cartographie", "télédétection/remote sensing" = "télédétection", "modèle numérique de terrain" = "MNT", "géomatique/geomatics/geospatial" = "géomatique", "SIG 3D / 3D GIS" = "SIG 3D" }
bloc_b = ["SIG", "analyse spatiale", "cartographie", "LiDAR", "télédétection", "MNT", "géomatique", "SIG 3D", "webSIG", "BIM"]
trio = ["LiDAR", "télédétection", "MNT"]
innovations = ["SIG 3D", "webSIG", "BIM"]
annee_citee = 2025
premiere_periode_trio = [1996, 2007]
seconde_periode_trio = [2018, 2025]

[reseau]
# Associations dominantes et noyau du bloc B.
associations_citees = 5
noyau = ["SIG", "analyse spatiale", "cartographie/mapping"]

[sankey]
# Flux concept A → couple → concept B, en œuvres distinctes,
# liens de poids au moins égal au seuil, les plus forts d'abord, dans la limite.
seuil_poids = 3
liens_max = 300
separateur_couple = " × "
fusion_libelles = { "cartographie/mapping" = "cartographie", "télédétection/remote sensing" = "télédétection", "modèle numérique de terrain" = "MNT" }
trio = ["LiDAR", "télédétection", "MNT"]
noyau = ["SIG", "analyse spatiale", "cartographie"]
concepts_cites = ["archéologie numérique", "archéologie de terrain", "périodes"]

[coauteurs]
# Réseau des co-auteurs : une publication de plus de auteurs_max personnes
# n'ajoute pas de liens (elle relierait des centaines de personnes d'un coup).
auteurs_max = 30
bornes_periodes = [1995, 2009, 2015, 2026]
libelles_periodes = ["1996-2009", "2010-2015", "2016-2025"]
seuil_equipe = 4
graine_louvain = 3

[mots_titres]
# Co-occurrences des mots des titres par année : équivalent de la requête Neo4j.
longueur_min_mot = 3
longueur_min_pluriel = 5
poids_min = 3
accents = [
    ["é", "e"],
    ["è", "e"],
    ["ê", "e"],
    ["ë", "e"],
    ["à", "a"],
    ["â", "a"],
    ["î", "i"],
    ["ï", "i"],
    ["ô", "o"],
    ["ù", "u"],
    ["û", "u"],
    ["ç", "c"],
]
