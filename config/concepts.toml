# Concepts des blocs A (archéologie) et B (géomatique et numérique).
#
# Un concept est un ensemble de termes français et anglais. La collecte croise
# des couples de concepts A × B (10 × 10 = 100 couples) ; chaque notice garde
# son couple dans la colonne AxB, sous la forme « libellé A × libellé B ».
#
# termes : ordre des requêtes HAL et OpenAlex, réunis par OU dans une
#          seule requête par couple ;
# termes_fr, termes_en : les mêmes termes, rangés par langue (le terme « site »
#          vaut pour les deux langues, BIM aussi) ;
# mots_sans_accents : mots français interrogés un à un sur SUDOC et Frantiq ;
# mots_theses : mots français interrogés un à un sur theses.fr.

[[bloc_a]]
libelle = "archéologie"
termes = ["archéologie", "archaeology", "archaeological", "archéologique"]
termes_fr = ["archéologie", "archéologique"]
termes_en = ["archaeology", "archaeological"]
mots_sans_accents = ["archeologie", "archeologique"]
mots_theses = ["archéologie", "archéologique"]

[[bloc_a]]
libelle = "périodes"
termes = ["préhistoire", "prehistory", "protohistoire", "protohistory", "antiquité", "antiquity", "médiéval", "medieval", "paléolithique", "paleolithic"]
termes_fr = ["préhistoire", "protohistoire", "antiquité", "médiéval", "paléolithique"]
termes_en = ["prehistory", "protohistory", "antiquity", "medieval", "paleolithic"]
mots_sans_accents = ["prehistoire", "protohistoire", "antiquite", "medieval", "paleolithique"]
mots_theses = ["préhistoire", "protohistoire", "antiquité", "médiéval", "paléolithique"]

