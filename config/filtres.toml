[prefiltre_sig]
# Étape « classe » : une notice qui contient l'un de ces motifs est classée SIG
# sans appel au modèle de langue.
champs_texte = ["titre", "resume", "mots_cles", "AxB"]
label = "sig"
confiance = 0.95
raison = "prefiltre"
# Les logiciels sont réunis dans un seul groupe borné : \b(?:logiciel1|logiciel2…)\b
logiciels = [
    'ArcGIS',
    'QGIS',
    'ArcMap',
    'ArcView',
    'ArcScene',
    'ArcCatalog',
    'GeoServer',
    'MapServer',
    'MapInfo',
    'PostGIS',
    'PostGreSQL.{0,5}PostGIS',
    'GRASS GIS',
    'GRASS.{0,5}gis',
    'GeoDa',
    'gvSIG',
    'SAGA GIS',
    'SAGA.{0,5}gis',
    'OpenJUMP',
    'uDig',
    'Geomatica',
    'TerrSet',
    'IDRISI',
    'ENVI',
    'ERDAS',
    'Global Mapper',
]

autres_motifs = [
    '''\b(?:GIS|SIG)\b''',
    '''\bsystème.{0,3}d[’'\s]+information.{0,3}géographique''',
    '''\bgeographic.{0,3}information.{0,3}system''',
    '''\bgeographical.{0,3}information.{0,3}system''',
    '''\bweb.?(?:GIS|SIG|mapping)\b''',
    '''\bg[ée]or[éefF][ée]rencement\b''',
    '''\bg[ée]or[éefF][ée]renc[éeée]''',
    '''\bgeoreferenc(?:ing|ed|e)\b''',
    '''\bg[ée]omatique\b|\bgeomatics\b''',
]

