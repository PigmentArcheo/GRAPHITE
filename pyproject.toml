[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bibliosig"
version = "1.0.0"
description = "Chaîne bibliométrique : collecte, classification, graphe Neo4j et analyses sur les SIG en archéologie française"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Laura Louman" }, { name = "Benoît Pandolfi" }]
keywords = ["bibliométrie", "archéologie", "SIG", "Neo4j", "HAL", "OpenAlex"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: French",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=3.0",
    "numpy>=2.4",
    "scikit-learn>=1.8",
    "rapidfuzz>=3.14",
    "requests>=2.32",
    "networkx>=3.6",
    "matplotlib>=3.10",
    "defusedxml>=0.7",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
llm = ["requests>=2.32"]
persee = ["rdflib>=7.6"]
figures = ["PyYAML>=6.0"]
neo4j = ["neo4j>=5.20"]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.7"]

[project.scripts]
bibliosig = "bibliosig.commande:principal"

[project.urls]
Code = "https://github.com/PigmentArcheo/GRAPHITE"
Bibliotheque = "https://www.zotero.org/groups/6617449/pigment_archeo"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bibliosig.graphe" = ["import.cypher"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "BLE", "SIM", "RUF"]
# Les chaînes et les commentaires contiennent des caractères français et le signe ×.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["bibliosig"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
